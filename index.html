<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="輸入要抽出的號碼數量，系統會從 1 至 49 之間抽出不重複號碼。">
  <title>LUNATIC DAWN NUMBER ORACLE｜異世酒館六合彩模擬器</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <div class="background-vignette" aria-hidden="true"></div>

    <header class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">LUNATIC DAWN NUMBER ORACLE</p>
        <h1 id="page-title">異世酒館六合彩模擬器</h1>
        <p class="hero-description">輸入要抽出的號碼數量，系統會從 1 至 49 之間抽出不重複號碼。</p>
        <time class="modified-time" datetime="2026-08-31T14:30:12+08:00">（修改日期：2026-08-31 14:30:12 HKT）</time>
      </div>
    </header>

    <div class="workspace">
      <section class="glass-panel controls" aria-label="抽號設定">
        <div class="section-title">
          <div><p class="kicker">天啟設定</p><h2>召喚命數</h2></div>
        </div>

        <div class="control-grid">
          <label><span>開獎期數</span><input id="issue" type="text" placeholder="人手輸入，例如 26/090"></label>
          <label><span>金多寶估值（港元）</span><input id="jackpot" type="text" inputmode="numeric" value="8,000,000"></label>
          <label><span>每次抽出號碼數量</span><input id="number-count" type="number" min="1" max="49" value="7"></label>
          <label><span>連抽次數（最多 20 次）</span><input id="repeat-count" type="number" min="1" max="20" value="1"></label>
        </div>

        <div id="ritual-stage" class="ritual-stage" aria-hidden="true">
          <div><div class="magic-circle"><span></span><span></span><span></span></div><p>星盤轉動，符文正在解讀命數</p></div>
        </div>

        <div class="bubble-stage" aria-label="本輪逐層抽出號碼">
          <p id="oracle-dialogue" class="oracle-dialogue" aria-live="polite">等待天啟</p>
          <div id="bubble-stack" class="bubble-stack" hidden></div>
          <p id="empty-result" class="empty-result">完成天啟後，第一次抽出的泡泡會留在最底，最後一次則堆在最頂</p>
        </div>

        <div class="actions">
          <button id="draw-button" class="oracle-button" type="button">開始占卜</button>
          <button id="copy-button" class="secondary-button" type="button" disabled>複製結果</button>
        </div>
      </section>

      <aside class="glass-panel prizes" aria-label="彩金估算">
        <p class="kicker">彩金預示</p><h2>各獎級估算</h2>
        <div id="prize-list" class="prize-list"></div>
        <p class="fine-print">此處只按輸入值作模擬估算，並非官方派彩。</p>
      </aside>
    </div>

    <section class="history-wrap" aria-labelledby="history-title">
      <div class="history-heading">
        <div><p class="kicker">命運卷軸</p><h2 id="history-title">最近紀錄</h2></div>
        <button id="clear-button" class="secondary-button" type="button" disabled>清除紀錄</button>
      </div>
      <div id="history-list" class="history-list" hidden></div>
      <div id="empty-history" class="empty-history">尚未有抽號紀錄。完成首次占卜後，右側會顯示金環號碼分佈圖。</div>
    </section>
  </main>
</body>
</html>
